<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Crossroads · hand-off</title>
<!-- Crossroads Contracting Sales Helper hand-off page. Owner: Nick Couture. Built 10/28/26 by Claude. v2 10/28: button hidden until 4 s.
     claude.ai's page frame blocks phone, text and email links, but a plain web link opens a new tab. The Sales Helper's
     Call / Text / Email buttons open this page; it hands the number or address to the phone's own app.
     The number rides after "#", which browsers never send to a server, so it never reaches GitHub. No tracking, no outside files. -->
<style>
  :root { color-scheme: light dark; --bg: #f3f4f2; --fg: #1d2422; --quiet: #5d6763; --btn: #1f5c73; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161b1a; --fg: #e8ecea; --quiet: #9aa5a1; --btn: #2c7a96; } }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--fg); font-family: -apple-system, "Segoe UI", Arial, sans-serif; }
  main { text-align: center; padding: 24px 16px; max-width: 420px; width: 100%; box-sizing: border-box; }
  a.big { display: inline-block; color: var(--btn); font-size: 17px; font-weight: 600; margin: 14px 0 6px; }
  a.big[hidden] { display: none; }
  .to { font-size: 18px; word-break: break-all; -webkit-user-select: all; user-select: all; }
  .quiet { color: var(--quiet); font-size: 15px; line-height: 1.4; }
</style>
</head>
<body>
<main>
  <p class="quiet" id="what">Opening…</p>
  <a class="big" id="go" href="#" hidden>Tap to continue</a>
  <p class="to" id="to"></p>
  <p class="quiet">Crossroads Sales Helper. When you're done, come back to the Sales Helper and log how it went.</p>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.hash.slice(1));
  var to = q.get("to") || "", label = q.get("label") || "";
  history.replaceState(null, "", location.pathname);  // clear the number from the address bar and history
  var a = document.getElementById("go"), what = document.getElementById("what"), show = document.getElementById("to");
  if (!/^(tel|sms|mailto|geo):/i.test(to)) { what.textContent = "Nothing to open. Go back to the Sales Helper."; a.style.display = "none"; return; }
  var kind = to.split(":")[0].toLowerCase();
  var verb = kind === "tel" ? "Call" : kind === "sms" ? "Text" : kind === "mailto" ? "Email" : "Open the map for";
  var target = to.replace(/^(tel|sms|mailto|geo):/i, "").replace(/^0,0\?q=/, "");
  try { target = decodeURIComponent(target); } catch (e) { }
  if (kind === "geo") to = "https://maps.apple.com/?q=" + encodeURIComponent(target);
  what.textContent = verb + " " + (label || target);
  a.textContent = "Didn't open? Tap to " + verb.toLowerCase();
  a.href = to;
  show.textContent = label || target;
  // The phone shows its own Call / Open prompt; the button stays hidden so it does not sit behind it (Nick 10/28), and appears only if nothing opened.
  setTimeout(function () { try { location.href = to; } catch (e) { } }, 300);
  setTimeout(function () { a.hidden = false; }, 4000);
})();
</script>
</body>
</html>
